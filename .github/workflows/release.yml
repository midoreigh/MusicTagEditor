name: Release

# Builds installers for every OS and publishes a GitHub Release when a
# version tag (v1.2.3) is pushed. Run it manually ("Run workflow") to build
# the installers as downloadable artifacts without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen
  # Qt's xcb platform plugin needs these at build time (so PyInstaller bundles
  # them).
  LINUX_QT_DEPS: >-
    libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0
    libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0
    libxcb-xinerama0 libxcb-xkb1 libfontconfig1 libdbus-1-3

jobs:
  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the app version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/mte/__init__.py)
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag doesn't match __version__ $version in src/mte/__init__.py"
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }

  test:
    needs: check-version
    # run even when check-version was skipped (manual runs)
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/ci.yml

  package:
    needs: test
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04      # oldest supported glibc -> runs on newer Ubuntu
          - os: windows-latest
          - os: macos-14          # Apple Silicon
          - os: macos-15-intel    # Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv publishes no moving major tag
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_QT_DEPS
      - run: uv sync --locked

      - name: Version
        id: version
        shell: bash
        run: echo "version=$(uv run python -c 'import mte; print(mte.__version__)')" >> "$GITHUB_OUTPUT"

      - name: PyInstaller
        run: uv run pyinstaller packaging/mte.spec --noconfirm

      # ---------------- Linux: AppImage + .deb
      - if: runner.os == 'Linux'
        name: Smoke test + package
        env:
          PYTHON: uv run python
        run: |
          dist/MusicTagEditor/mte --smoke-test
          packaging/linux/build_linux.sh "${{ steps.version.outputs.version }}"

      # ---------------- Windows: Inno Setup installer
      - if: runner.os == 'Windows'
        name: Smoke test + installer
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\MusicTagEditor\MusicTagEditor.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test failed: $($p.ExitCode)" }
          New-Item -ItemType Directory -Force build | Out-Null
          uv run python -c "from PIL import Image; Image.open('packaging/icon.png').save('build/icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" packaging\windows\installer.iss
          Compress-Archive -Path dist\MusicTagEditor -DestinationPath "dist\MusicTagEditor-${{ steps.version.outputs.version }}-windows-x64-portable.zip"

      # ---------------- macOS: .app in a DMG
      - if: runner.os == 'macOS'
        name: Smoke test + DMG
        run: |
          "dist/Music Tag Editor.app/Contents/MacOS/MusicTagEditor" --smoke-test
          packaging/macos/build_dmg.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: mte-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on && /^\[.*\]: / {next}
            on {print}
          ' CHANGELOG.md > notes.md
          cat notes.md
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: Music Tag Editor ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/*
